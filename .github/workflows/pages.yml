name: Deploy to GitHub Pages
# Unpacks the site and publishes it to the gh-pages branch (Pages source: gh-pages / root).
# If Pages is later switched to "GitHub Actions" as the source in Settings > Pages,
# the "actions-deploy" job deploys directly as well.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack site/ (packed tarball, byte-identical copy of live files)
        run: cat blobs/site.tgz.b64.* | base64 -d | tar xz && ls -R site
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          enable_jekyll: false
          force_orphan: true
  actions-deploy:
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: cat blobs/site.tgz.b64.* | base64 -d | tar xz
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
